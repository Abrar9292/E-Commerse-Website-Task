<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- LOGIN FORM -->

    <section class="form-container">

        <form class="form-box">

            <h2>Login</h2>

            <input type="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

            <p>
                Don't have account?
                <a href="register.html">
                    Register
                </a>
            </p>

        </form>

    </section>

</body>

</html>
