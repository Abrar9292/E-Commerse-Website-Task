<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- REGISTER FORM -->

    <section class="form-container">

        <form class="form-box">

            <h2>Register</h2>

            <input type="text"
                   placeholder="Enter Name"
                   required>

            <input type="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   placeholder="Create Password"
                   required>

            <button type="submit">
                Register
            </button>

            <p>
                Already have account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </form>

    </section>

</body>

</html>
